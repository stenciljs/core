name: Perf Benchmark - SSR

on:
  workflow_call:
    # Make this a reusable workflow, no value needed
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows

permissions:
  contents: read

jobs:
  perf_ssr:
    name: SSR Render Time
    # Gated by main.yml (push, or a PR labeled "SSR Performance")
    # In-process benchmarks, measured by CPU simulation on a standard runner. Pinned: the CodSpeed
    # runner this action version installs rejects Ubuntu 26.04 ("Unsupported system").
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stencil-build
          path: packages/

      - name: Build SSR Benchmark App
        run: pnpm build
        working-directory: test/perf/ssr-benchmark
        shell: bash

      - name: Run SSR Benchmark
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation
          run: node ${{ github.workspace }}/test/perf/ssr-benchmark/benchmark-codspeed.mjs

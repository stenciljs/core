name: CI

on:
  merge_group:
  push:
    branches:
      - 'main'
      - 'v5'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build runs first
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  # Everything else runs in parallel after build
  quality:
    name: Quality
    needs: [build]
    uses: ./.github/workflows/quality.yml

  unit_tests:
    name: Unit Tests
    needs: [build]
    uses: ./.github/workflows/test-unit.yml

  build_tests:
    name: Build Tests
    needs: [build]
    uses: ./.github/workflows/test-build.yml

  integration_tests:
    name: Integration Tests
    needs: [build]
    uses: ./.github/workflows/test-integration.yml

  runtime_tests:
    name: Runtime Tests
    needs: [build]
    uses: ./.github/workflows/test-runtime.yml

  special_config_tests:
    name: Special Config Tests
    needs: [build]
    uses: ./.github/workflows/test-special-config.yml

  ssr_tests:
    name: SSR Tests
    needs: [build]
    uses: ./.github/workflows/test-ssr.yml

  ssr_wasm_tests:
    name: SSR WASM Tests
    needs: [build]
    uses: ./.github/workflows/test-ssr-wasm.yml

  component_starter_tests:
    name: Component Starter Smoke Test
    needs: [build]
    uses: ./.github/workflows/test-component-starter.yml

  # Perf benchmarks aren't run as jobs of this workflow - a job paused on the
  # perf-approval environment gate would leave this whole run "in progress",
  # which blocks re-running any other (e.g. flaky) job here until it resolves.
  # Instead this job only records what a downstream run needs to benchmark the
  # right commit; see perf-benchmark.yml, triggered by this workflow's completion.
  perf_context:
    name: Perf Context
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write Perf Context
        run: |
          mkdir -p perf-context
          echo "${{ github.sha }}" > perf-context/head-sha.txt
          echo "${{ github.event.pull_request.number }}" > perf-context/pr-number.txt
          echo "${{ github.event.pull_request.base.sha }}" > perf-context/base-sha.txt
        shell: bash

      - name: Upload Perf Context
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: perf-context
          path: perf-context/
          retention-days: 1

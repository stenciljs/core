name: CI

on:
  merge_group:
  push:
    branches:
      - 'main'
      - 'stencil/v4-dev'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_core:
    name: Build
    uses: ./.github/workflows/build.yml

  lint_and_format:
    name: Lint and Format
    uses: ./.github/workflows/lint-and-format.yml

  type_tests:
    name: Type Tests
    needs: [build_core]
    uses: ./.github/workflows/test-types.yml

  analysis_tests:
    name: Analysis Tests
    needs: [build_core]
    uses: ./.github/workflows/test-analysis.yml

  docs_build_tests:
    name: Docs Build Tests
    needs: [build_core]
    uses: ./.github/workflows/test-docs-build.yml

  bundler_tests:
    name: Bundler Tests
    needs: [build_core]
    uses: ./.github/workflows/test-bundlers.yml

  copytask_tests:
    name: Copy Task Tests
    needs: [build_core]
    uses: ./.github/workflows/test-copytask.yml

  component_starter_tests:
    name: Component Starter Smoke Test
    needs: [build_core]
    uses: ./.github/workflows/test-component-starter.yml

  e2e_tests:
    name: E2E Tests
    needs: [build_core]
    uses: ./.github/workflows/test-e2e.yml

  unit_tests:
    name: Unit Tests
    needs: [build_core]
    uses: ./.github/workflows/test-unit.yml

  wdio_tests:
    name: WebdriverIO Tests
    needs: [build_core]
    uses: ./.github/workflows/test-wdio.yml

  # Perf benchmarks aren't run as jobs of this workflow - a job paused on the
  # perf-approval environment gate would leave this whole run "in progress",
  # which blocks re-running any other (e.g. flaky) job here until it resolves.
  # Instead this job only records what a downstream run needs to benchmark the
  # right commit; see perf-benchmark.yml, triggered by this workflow's completion.
  perf_context:
    name: Perf Context
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write Perf Context
        run: |
          mkdir -p perf-context
          echo "${{ github.sha }}" > perf-context/head-sha.txt
          echo "${{ github.event.pull_request.number }}" > perf-context/pr-number.txt
          echo "${{ github.event.pull_request.base.sha }}" > perf-context/base-sha.txt
        shell: bash

      - name: Upload Perf Context
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: perf-context
          path: perf-context/
          retention-days: 1

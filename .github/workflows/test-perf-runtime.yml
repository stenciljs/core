name: Perf Benchmark - Runtime

on:
  workflow_call:
    inputs:
      head-ref:
        description: 'PR commit SHA to check out and benchmark'
        required: true
        type: string
      base-ref:
        description: 'base commit SHA to benchmark against'
        required: true
        type: string
      pr-number:
        description: 'PR number, forwarded to the results artifact for the comment-posting workflow'
        required: true
        type: string
      artifact-run-id:
        description: 'run id of the CI run to download the stencil-core build artifact from'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  perf_runtime_diff:
    name: Runtime Benchmark (PR vs base)
    environment: perf-approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout PR Head
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.head-ref }}

      - name: Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      - name: Download Build Archive
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: stencil-core
          path: .
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Build Archive
        run: unzip -q -o stencil-core-build.zip -d .
        shell: bash

      - name: Install PR test/runtime-benchmark Dependencies
        run: npm ci
        working-directory: test/runtime-benchmark
        shell: bash

      - name: Run PR Runtime Benchmark
        run: npm run benchmark
        working-directory: test/runtime-benchmark
        shell: bash

      - name: Convert PR Results to Raw Format
        run: node to-codspeed-raw.js "$GITHUB_WORKSPACE/pr-raw.json"
        working-directory: test/runtime-benchmark
        shell: bash

      - name: Checkout Base Branch
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.base-ref }}
          path: base

      - name: Install Base Dependencies
        run: |
          npm ci
          npm run install.jest
        working-directory: base
        shell: bash

      - name: Build Base Stencil Core
        run: npm run build -- --ci
        working-directory: base
        shell: bash

      - name: Install Base test/runtime-benchmark Dependencies
        run: npm ci
        working-directory: base/test/runtime-benchmark
        shell: bash

      - name: Run Base Runtime Benchmark
        run: npm run benchmark
        working-directory: base/test/runtime-benchmark
        shell: bash

      - name: Convert Base Results to Raw Format
        run: node to-codspeed-raw.js "$GITHUB_WORKSPACE/base-raw.json"
        working-directory: base/test/runtime-benchmark
        shell: bash

      - name: Write PR Number
        run: echo "${{ inputs.pr-number }}" > pr-number.txt
        shell: bash

      # Uploaded as data only, for a separate privileged workflow to read and post
      # a comment - this job's token is deliberately kept read-only (no write scopes
      # declared anywhere in its permissions), since it builds and executes the PR's
      # own code. Fork PRs never reach this job at all (see perf-benchmark.yml).
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: perf-runtime-results
          path: |
            pr-raw.json
            base-raw.json
            pr-number.txt
          retention-days: 1

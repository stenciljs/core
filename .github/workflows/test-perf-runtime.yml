name: Perf Benchmark - Runtime

on:
  workflow_call:
    # Make this a reusable workflow, no value needed
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows

permissions:
  contents: read

jobs:
  perf_runtime_diff:
    name: Runtime Benchmark (PR vs base)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR Head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stencil-build
          path: packages/

      - name: Install Playwright Browsers
        uses: ./.github/workflows/actions/install-playwright
        with:
          working-directory: test/perf/runtime-benchmark

      - name: Run PR Runtime Benchmark
        run: pnpm --filter "@stencil-core-tests/perf-runtime-benchmark" test
        shell: bash

      - name: Convert PR Results to Raw Format
        run: node to-codspeed-raw.js "$GITHUB_WORKSPACE/pr-raw.json"
        working-directory: test/perf/runtime-benchmark
        shell: bash

      - name: Checkout Base Branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Detect Base Package Manager
        id: detect-base-pm
        run: |
          if [ -f "base/pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # base = v5 (or a v5 descendant): pnpm, test/perf/runtime-benchmark, Playwright
      - name: Install Playwright Browsers (Base)
        if: steps.detect-base-pm.outputs.pm == 'pnpm'
        uses: ./.github/workflows/actions/install-playwright
        with:
          working-directory: base/test/perf/runtime-benchmark

      - name: Install Base Dependencies (pnpm)
        if: steps.detect-base-pm.outputs.pm == 'pnpm'
        run: pnpm install --frozen-lockfile
        working-directory: base
        shell: bash

      - name: Build Base Stencil Core (pnpm)
        if: steps.detect-base-pm.outputs.pm == 'pnpm'
        run: pnpm build
        working-directory: base
        shell: bash

      - name: Run Base Runtime Benchmark (pnpm)
        if: steps.detect-base-pm.outputs.pm == 'pnpm'
        run: pnpm --filter "@stencil-core-tests/perf-runtime-benchmark" test
        working-directory: base
        shell: bash

      - name: Convert Base Results to Raw Format (pnpm)
        if: steps.detect-base-pm.outputs.pm == 'pnpm'
        run: node to-codspeed-raw.js "$GITHUB_WORKSPACE/base-raw.json"
        working-directory: base/test/perf/runtime-benchmark
        shell: bash

      # base = main (or a main descendant): npm, test/runtime-benchmark, Puppeteer
      - name: Install Base Dependencies (npm)
        if: steps.detect-base-pm.outputs.pm == 'npm'
        run: |
          npm ci
          npm run install.jest
        working-directory: base
        shell: bash

      - name: Build Base Stencil Core (npm)
        if: steps.detect-base-pm.outputs.pm == 'npm'
        run: npm run build -- --ci
        working-directory: base
        shell: bash

      - name: Install Base test/runtime-benchmark Dependencies (npm)
        if: steps.detect-base-pm.outputs.pm == 'npm'
        run: npm ci
        working-directory: base/test/runtime-benchmark
        shell: bash

      - name: Run Base Runtime Benchmark (npm)
        if: steps.detect-base-pm.outputs.pm == 'npm'
        run: npm run benchmark
        working-directory: base/test/runtime-benchmark
        shell: bash

      - name: Convert Base Results to Raw Format (npm)
        if: steps.detect-base-pm.outputs.pm == 'npm'
        run: node to-codspeed-raw.js "$GITHUB_WORKSPACE/base-raw.json"
        working-directory: base/test/runtime-benchmark
        shell: bash

      - name: Write PR Number
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt
        shell: bash

      # Uploaded as data only, for a separate privileged workflow to read and post
      # a comment - this job never gets write access (forks always get a read-only
      # GITHUB_TOKEN for pull_request-triggered runs, by GitHub's design), and it
      # must stay that way since this job builds and executes the PR's own code.
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: perf-runtime-results
          path: |
            pr-raw.json
            base-raw.json
            pr-number.txt
          retention-days: 1

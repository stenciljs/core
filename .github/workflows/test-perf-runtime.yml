name: Perf Benchmark - Runtime

on:
  workflow_call:
    # Make this a reusable workflow, no value needed
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows

permissions:
  contents: read

jobs:
  perf_runtime_diff:
    name: Runtime Benchmark (PR vs base)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout PR Head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stencil-build
          path: packages/

      - name: Install Playwright Browsers
        uses: ./.github/workflows/actions/install-playwright
        with:
          working-directory: test/perf/runtime-benchmark

      - name: Run PR Runtime Benchmark
        run: pnpm --filter "@stencil-core-tests/perf-runtime-benchmark" test
        shell: bash

      - name: Convert PR Results to Raw Format
        run: node to-codspeed-raw.js "$GITHUB_WORKSPACE/pr-raw.json"
        working-directory: test/perf/runtime-benchmark
        shell: bash

      - name: Checkout Base Branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install Base Dependencies
        run: |
          npm ci
          npm run install.jest
        working-directory: base
        shell: bash

      - name: Build Base Stencil Core
        run: npm run build -- --ci
        working-directory: base
        shell: bash

      - name: Install Base test/runtime-benchmark Dependencies
        run: npm ci
        working-directory: base/test/runtime-benchmark
        shell: bash

      - name: Run Base Runtime Benchmark
        run: npm run benchmark
        working-directory: base/test/runtime-benchmark
        shell: bash

      - name: Convert Base Results to Raw Format
        run: node to-codspeed-raw.js "$GITHUB_WORKSPACE/base-raw.json"
        working-directory: base/test/runtime-benchmark
        shell: bash

      - name: Post Runtime Benchmark Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const script = require('./.github/workflows/scripts/post-runtime-benchmark-comment.js');
            await script({ github, context, prNumber: context.issue.number });

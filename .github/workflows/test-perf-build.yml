name: Perf Benchmark - Build

on:
  workflow_call:
    inputs:
      ref:
        description: 'commit SHA to check out and benchmark'
        required: true
        type: string
      artifact-run-id:
        description: 'run id of the CI run to download the stencil-core build artifact from'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  perf_build_cold:
    name: Compile Time (cold)
    environment: perf-approval
    runs-on: codspeed-macro
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.ref }}

      - name: Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      - name: Download Build Archive
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: stencil-core
          path: .
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Build Archive
        run: unzip -q -o stencil-core-build.zip -d .
        shell: bash

      - name: Install test/end-to-end Dependencies
        run: npm ci
        working-directory: test/end-to-end
        shell: bash

      - name: Clear Compile Cache
        run: rm -rf .stencil
        working-directory: test/end-to-end
        shell: bash

      - name: Write CodSpeed Benchmark Config
        run: |
          cat > codspeed.yml <<'EOF'
          benchmarks:
            - name: Compile Time (cold)
              exec: node ${{ github.workspace }}/bin/stencil build --config ${{ github.workspace }}/test/end-to-end/stencil.build.config.ts
              options:
                warmup-time: 0s
                min-rounds: 1
                max-rounds: 1
                max-time: 180s
          EOF
        working-directory: test/end-to-end
        shell: bash

      - name: Run Cold Build Benchmark
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          config: ${{ github.workspace }}/test/end-to-end/codspeed.yml

  perf_build_warm:
    name: Compile Time (warm)
    environment: perf-approval
    runs-on: codspeed-macro
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.ref }}

      - name: Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      - name: Download Build Archive
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: stencil-core
          path: .
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Build Archive
        run: unzip -q -o stencil-core-build.zip -d .
        shell: bash

      - name: Install test/end-to-end Dependencies
        run: npm ci
        working-directory: test/end-to-end
        shell: bash

      - name: Warm Compile Cache
        run: |
          rm -rf .stencil
          node ../../bin/stencil build --config ./stencil.build.config.ts
        working-directory: test/end-to-end
        shell: bash

      - name: Write CodSpeed Benchmark Config
        run: |
          cat > codspeed.yml <<'EOF'
          benchmarks:
            - name: Compile Time (warm)
              exec: node ${{ github.workspace }}/bin/stencil build --config ${{ github.workspace }}/test/end-to-end/stencil.build.config.ts
              options:
                warmup-time: 0s
                min-rounds: 2
                max-rounds: 2
                max-time: 180s
          EOF
        working-directory: test/end-to-end
        shell: bash

      - name: Run Warm Build Benchmark
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          config: ${{ github.workspace }}/test/end-to-end/codspeed.yml

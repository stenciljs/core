name: Perf Benchmark - Build

on:
  workflow_call:
    # Make this a reusable workflow, no value needed
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows

permissions:
  contents: read

jobs:
  perf_build_cold:
    name: Compile Time (cold)
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: codspeed-macro
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      - name: Download Build Archive
        uses: ./.github/workflows/actions/download-archive
        with:
          name: stencil-core
          path: .
          filename: stencil-core-build.zip

      - name: Install test/end-to-end Dependencies
        run: npm ci
        working-directory: test/end-to-end
        shell: bash

      - name: Clear Compile Cache
        run: rm -rf .stencil
        working-directory: test/end-to-end
        shell: bash

      - name: Write CodSpeed Benchmark Config
        run: |
          cat > codspeed.yml <<'EOF'
          benchmarks:
            - name: Compile Time (cold)
              exec: node ${{ github.workspace }}/bin/stencil build --config ${{ github.workspace }}/test/end-to-end/stencil.build.config.ts
              options:
                warmup-time: 0s
                min-rounds: 1
                max-rounds: 1
                max-time: 180s
          EOF
        working-directory: test/end-to-end
        shell: bash

      - name: Run Cold Build Benchmark
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          config: ${{ github.workspace }}/test/end-to-end/codspeed.yml

  perf_build_warm:
    name: Compile Time (warm)
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: codspeed-macro
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      - name: Download Build Archive
        uses: ./.github/workflows/actions/download-archive
        with:
          name: stencil-core
          path: .
          filename: stencil-core-build.zip

      - name: Install test/end-to-end Dependencies
        run: npm ci
        working-directory: test/end-to-end
        shell: bash

      - name: Warm Compile Cache
        run: |
          rm -rf .stencil
          node ../../bin/stencil build --config ./stencil.build.config.ts
        working-directory: test/end-to-end
        shell: bash

      - name: Write CodSpeed Benchmark Config
        run: |
          cat > codspeed.yml <<'EOF'
          benchmarks:
            - name: Compile Time (warm)
              exec: node ${{ github.workspace }}/bin/stencil build --config ${{ github.workspace }}/test/end-to-end/stencil.build.config.ts
              options:
                warmup-time: 0s
                min-rounds: 2
                max-rounds: 2
                max-time: 180s
          EOF
        working-directory: test/end-to-end
        shell: bash

      - name: Run Warm Build Benchmark
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          config: ${{ github.workspace }}/test/end-to-end/codspeed.yml
